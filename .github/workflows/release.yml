# Client release: runs only for version tags (scripts/release.sh), never per commit.
# Server code deploys separately via Coolify on push to main.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/desktop

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'apps/web/static/install.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

      # Builds apps/web (beforeBuildCommand) and bundles .msi + NSIS .exe,
      # then creates the GitHub release for this tag with the installers.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public room-api URL baked into the bundled UI (repo variable, not a secret).
          # Empty → the app asks for it on first run.
          VITE_API_URL: ${{ vars.PEEP_API_URL }}
          # Signs the updater artifacts; the public key lives in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Peep ${{ github.ref_name }}
          releaseBody: |
            **Windows:** baixe o `.msi` ou o `-setup.exe`.
            **Linux (Omarchy):** baixe `peep-omarchy-plugin.tar.gz` e siga `apps/quickshell/README.md`.
          releaseDraft: false
          prerelease: false
          # latest.json (read by the in-app updater) points at the NSIS setup.
          updaterJsonPreferNsis: true

  omarchy-plugin:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle public server defaults
        env:
          PEEP_API_URL: ${{ vars.PEEP_API_URL }}
          PEEP_WEB_URL: ${{ vars.PEEP_WEB_URL }}
        run: |
          jq -n --arg api "$PEEP_API_URL" --arg web "$PEEP_WEB_URL" \
            '{apiUrl: $api, webUrl: $web}' > apps/quickshell/server-defaults.json
      - name: Package Omarchy/Quickshell plugin
        run: tar -czf peep-omarchy-plugin.tar.gz --transform 's,^apps/quickshell,peep,' apps/quickshell
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" peep-omarchy-plugin.tar.gz apps/web/static/install.sh apps/web/static/install.ps1 --clobber

# Coolify: Docker Compose build pack, Base Directory "/infra",
# Docker Compose Location "/docker-compose.yml". See infra/README.md.
# LiveKit is a separate Coolify app (infra/livekit/docker-compose.yml), so
# deploying the API/web never restarts the media server or drops calls.
services:
  room-api:
    build: ../apps/api
    restart: unless-stopped
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIVEKIT_URL: "http://host.docker.internal:7880"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?}"
      INVITE_SECRET: "${INVITE_SECRET:?}"
      PUBLIC_LIVEKIT_WS_URL: "${PUBLIC_LIVEKIT_WS_URL:?}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      # Optional admin panel (/admin); disabled unless both are set.
      ADMIN_USER: "${ADMIN_USER:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      PORT: "8080"

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_URL: "${PUBLIC_API_URL:?}"
    restart: unless-stopped
    expose:
      - "8080"
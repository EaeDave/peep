# LiveKit config — no secrets/domains here.
# Keys come from LIVEKIT_KEYS, TURN domain from LIVEKIT_TURN_DOMAIN (Coolify env).
port: 7880
# API endpoint for signed lifecycle events; adjust when deploying on another domain.
webhook:
  urls:
    - https://peep-api.eaedave.xyz/webhooks/livekit
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  # Host network sees every Docker bridge; offer only the real NIC as ICE
  # candidate. Interface name of this VPS (Oracle Ubuntu); adjust on other hosts.
  interfaces:
    includes:
      - enp0s6
turn:
  enabled: true
  udp_port: 3478
  # TURN/TLS: Traefik terminates TLS on :443 (SNI turn.DOMINIO) and forwards
  # plain TCP to 5349; external_tls makes LiveKit advertise turns:…:443.
  tls_port: 5349
  external_tls: true
room:
  empty_timeout: 300
  max_participants: 10
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8
    - mime: video/vp9
    - mime: video/h264
    - mime: video/av1
logging:
  level: info
